[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.9",
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
    "langchain-aws>=1.10.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-text-splitters>=1.2.0",
    "markdownify>=1.2.4",
    "pinecone>=10.3.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.4",
    "sentence-transformers>=6.3.0",
    "sqlmodel>=0.0.50",
    "sse-starlette>=3.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
